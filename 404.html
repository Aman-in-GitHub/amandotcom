<!doctype html>
<html lang="en-NP">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Page Not Found | Aman Chand</title>
    <meta name="robots" content="noindex, follow" />

    <meta name="theme-color" content="#3a0c1c" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/roboto-flex-latin-wght-normal.woff2"
      crossorigin
    />

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      :root {
        --background: #3a0c1c;
        --foreground: #f5e7dc;
        --accent: #e0899a;
      }

      @font-face {
        font-family: "Roboto Flex";
        src: url("/roboto-flex-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 1000;
        font-style: normal;
        font-display: optional;
      }

      body {
        margin: 0 auto;
        padding: 1.5rem;
        max-width: 1200px;

        color: var(--foreground);
        background-color: var(--background);

        font-family: "Roboto Flex", sans-serif;
        font-weight: 400;
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-weight: 900;
        text-transform: uppercase;
      }

      a {
        color: var(--accent);
        font-weight: 500;
        text-underline-offset: 2px;
        transition: opacity 150ms linear;
      }

      a:hover {
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>404</h1>

      <p>Page not found</p>
    </header>

    <main>
      <a href="/" title="Go to the homepage">Back to home</a>
    </main>
  </body>
</html>
